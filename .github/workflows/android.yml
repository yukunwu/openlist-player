name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest testReleaseUnitTest lintDebug lintRelease assembleDebug assembleRelease
      - name: Package APKs
        shell: bash
        run: |
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/openlist-tv-${version}-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/openlist-tv-${version}-release-unsigned.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "dist/openlist-tv-${version}-debug.apk"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c 4 "dist/openlist-tv-${version}-release-unsigned.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openlist-tv-apks
          path: dist/
          retention-days: 14
          if-no-files-found: error

  sign:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'build-tools;34.0.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openlist-tv-apks
          path: unsigned
      - name: Sign release APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keyfile="$RUNNER_TEMP/release-signing.keystore"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          mkdir -p signed
          for apk in unsigned/*-release-unsigned.apk; do
            name=$(basename "$apk" -release-unsigned.apk)
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
              --ks "$keyfile" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --out "signed/${name}-release.apk" "$apk"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "signed/${name}-release.apk" > signed/CERTIFICATE.txt
            "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c 4 "signed/${name}-release.apk"
          done
          (cd signed && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openlist-tv-signed-release
          path: signed/
          retention-days: 14
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openlist-tv-signed-release
          path: dist
      - name: Publish version assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          Automated Android build (Android 6.0 / API 23+).

          - `release.apk`: optimized APK signed with the project's stable production certificate.
          - `CERTIFICATE.txt`: public signing certificate fingerprints and verification result.
          - `SHA256SUMS.txt`: APK checksum.

          Requires Android 6.0 / API 23+. This production certificate cannot replace a debug installation. Do not uninstall or clear data just to work around a signature mismatch.
          EOF
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release upload "$VERSION_TAG" dist/* --clobber
          else
            gh release create "$VERSION_TAG" dist/* --title "OpenList TV $VERSION_TAG" --notes-file notes.md --verify-tag
          fi

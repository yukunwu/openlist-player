plugins { id 'com.android.application' }

// Private signing material stays outside the repository; unsigned builds still work without it.
def releaseSigning = new Properties()
def releaseSigningFile = file(System.getenv('OPENLIST_SIGNING_PROPERTIES') ?:
        "${System.getProperty('user.home')}/.config/openlist-tv/signing.properties")
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
        if (!releaseSigning.getProperty(key)) throw new GradleException("Missing release signing property: ${key}")
    }
}

android {
    namespace 'site.openlist.player'
    compileSdk 35
    defaultConfig {
        applicationId 'site.openlist.player'
        minSdk 23
        targetSdk 35
        versionCode 11
        versionName '0.1.10'
        testInstrumentationRunner 'site.openlist.player.PlayerUiInstrumentation'
    }
    signingConfigs {
        if (!releaseSigning.isEmpty()) {
            release {
                storeFile file(releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (!releaseSigning.isEmpty()) signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    testImplementation 'junit:junit:4.13.2'
}
